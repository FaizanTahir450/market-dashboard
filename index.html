<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uplot@1.6.31/dist/uPlot.min.css">
<style>
/* Layout: one 1180px research column; a score/price/cycle summary band on top, then the
   condition table, synced charts and reference tables. Cool-grey neutrals, chart blue accent,
   red = bear-market bottoms, violet = the open (current) cycle. */
:root {
  --bg: #f1f3f5; --surface: #fbfcfd; --surface-2: #eceff3; --ink: #10161c; --ink2: #47525c; --muted: #7b8691;
  --line: #d9dfe5; --grid: #e3e7ec; --axis: #c3cad2;
  --accent: #2a78d6; --accent-soft: #dce9f8;
  --c-blue: #2a78d6; --c-orange: #eb6834; --c-aqua: #1baf7a; --c-yellow: #eda100; --c-violet: #6250d6; --c-red: #e34948; --c-muted: #9aa3ad;
  --good: #0b7a0b; --good-soft: #dff2df; --warn: #946200; --warn-soft: #fbecc9; --bad: #b73232; --bad-soft: #f8dfdf; --note: #2a5f9e; --note-soft: #e0ebf8;
  --font-display: "IBM Plex Sans Condensed", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d1013; --surface: #161a1e; --surface-2: #1e2328; --ink: #e9edf1; --ink2: #b3bcc5; --muted: #85909a;
    --line: #2a3138; --grid: #242a30; --axis: #3a424b;
    --accent: #3987e5; --accent-soft: #1b2f48;
    --c-blue: #3987e5; --c-orange: #d95926; --c-aqua: #199e70; --c-yellow: #c98500; --c-violet: #9085e9; --c-red: #e66767; --c-muted: #6c7782;
    --good: #4cc24c; --good-soft: #15301a; --warn: #e0a830; --warn-soft: #3a2d10; --bad: #ef7b7b; --bad-soft: #3a1c1c; --note: #8db8ee; --note-soft: #1b2f48;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font-body);
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 22px 64px; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* gate */
.gate { min-height: 100vh; display: grid; place-items: center; padding: 24px max(16px, env(safe-area-inset-left, 0px)); }
.gate-card { width: 100%; max-width: 360px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 26px 24px; display: grid; gap: 12px; }
.gate-card h1 { margin: 0; font: 600 22px/1.2 var(--font-display); }
.gate-card p { margin: 0; color: var(--ink2); font-size: 14px; }
.gate-card label { font-size: 13px; color: var(--ink2); }
.gate-card input[type=password] { width: 100%; font: 16px var(--font-body); padding: 10px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
.chk { display: flex; gap: 8px; align-items: center; }
.btn { font: 500 15px var(--font-body); padding: 10px 14px; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; }
.btn:disabled { opacity: .6; cursor: progress; }
.btn.ghost { background: transparent; color: var(--ink2); border-color: var(--line); padding: 6px 10px; font-size: 13px; }
.gate-msg { min-height: 20px; color: var(--bad); font-size: 13px; }

/* header */
header.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px 18px; padding-bottom: 16px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
header.top h1 { margin: 0; font: 600 clamp(26px, 4vw, 36px)/1.05 var(--font-display); text-wrap: balance; }
.meta-line { font: 12.5px var(--font-mono); color: var(--muted); }
.head-right { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
nav.toc { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; margin: -6px 0 18px; }
nav.toc a { text-decoration: none; }

/* summary band */
.band { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 12px; margin-bottom: 14px; }
@media (max-width: 900px) { .band { grid-template-columns: 1fr; } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px 18px; min-width: 0; }
.card h2 { margin: 0 0 10px; font: 600 13px var(--font-body); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.score-row { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.score-big { font: 600 54px/1 var(--font-display); }
.score-big small { font-size: 22px; color: var(--muted); font-weight: 500; }
.pill { display: inline-block; font: 500 12px/1.4 var(--font-body); padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink2); white-space: nowrap; }
.pill.calm { color: var(--good); border-color: var(--good); background: var(--good-soft); }
.pill.note { color: var(--note); border-color: var(--note); background: var(--note-soft); }
.pill.warn { color: var(--warn); border-color: var(--warn); background: var(--warn-soft); }
.pill.crit { color: var(--bad); border-color: var(--bad); background: var(--bad-soft); }
.pill.on { color: var(--warn); border-color: var(--warn); background: var(--warn-soft); }
.pill.off { color: var(--muted); }
.pill.core { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); font-size: 11px; padding: 0 7px; }
.regime-text { color: var(--ink2); font-size: 14px; margin: 8px 0 12px; }
.meter { position: relative; height: 34px; margin-top: 4px; }
.meter .track { position: absolute; left: 0; right: 0; top: 8px; height: 10px; border-radius: 5px; background: var(--surface-2); overflow: hidden; }
.meter .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 5px; }
.meter .zone { position: absolute; top: 4px; height: 18px; border: 1.5px dashed var(--c-red); border-radius: 4px; }
.meter .tick { position: absolute; top: 22px; font: 11px var(--font-mono); color: var(--muted); transform: translateX(-50%); }
.meter .tickline { position: absolute; top: 8px; height: 10px; width: 1px; background: var(--surface); }
.legend-note { font-size: 12px; color: var(--muted); margin-top: 4px; }
.big { font: 600 34px/1.05 var(--font-display); }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; margin-top: 10px; font-size: 14px; }
.kv span:nth-child(odd) { color: var(--ink2); }
.kv span:nth-child(even) { text-align: right; font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 18px; }
.chip { font-size: 12.5px; padding: 3px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); }
.chip.core { border-color: var(--accent); }
.chips .lbl { font-size: 12.5px; color: var(--muted); padding: 3px 0; }

section { margin: 30px 0 0; }
section > h2 { font: 600 24px/1.15 var(--font-display); margin: 0 0 6px; text-wrap: balance; scroll-margin-top: 12px; }
.lede { color: var(--ink2); max-width: 78ch; margin: 0 0 12px; font-size: 14.5px; }

/* tables */
.tbl { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; max-width: 100%; }
table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: right; vertical-align: top; white-space: nowrap; }
th { background: var(--surface-2); color: var(--ink2); font-weight: 500; font-size: 12px; position: sticky; top: 0; z-index: 1; }
th.l, td.l { text-align: left; }
td.wrap-cell { white-space: normal; min-width: 220px; max-width: 360px; }
tr:last-child td { border-bottom: 0; }
td.grp { background: var(--surface-2); text-align: left; font: 600 12.5px var(--font-body); letter-spacing: .03em; color: var(--ink2); }
.sticky1 th:first-child, .sticky1 td:first-child { position: sticky; left: 0; background: var(--surface); z-index: 1; box-shadow: 1px 0 0 var(--line); }
.sticky1 th:first-child { background: var(--surface-2); z-index: 2; }
.sticky1 td.grp:first-child { background: var(--surface-2); }
.sub { font-size: 11.5px; color: var(--muted); margin-top: 2px; white-space: normal; }
.num { font-family: var(--font-mono); font-size: 12.5px; }
.tag { font: 500 12px var(--font-mono); padding: 1px 6px; border-radius: 4px; }
.tag.good { color: var(--good); background: var(--good-soft); }
.tag.warn { color: var(--warn); background: var(--warn-soft); }
.tag.bad { color: var(--bad); background: var(--bad-soft); }
.muted { color: var(--muted); }
tr.is-on td:first-child { box-shadow: inset 3px 0 0 var(--warn), 1px 0 0 var(--line); }
.filters { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 10px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--surface); }
.seg button { font: 500 13px var(--font-body); border: 0; background: transparent; color: var(--ink2); padding: 6px 12px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }

/* charts */
.charts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.charts .wide { grid-column: 1 / -1; }
@media (max-width: 900px) { .charts { grid-template-columns: 1fr; } }
.chart-card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 12px 6px; min-width: 0; }
.chart-card h3 { margin: 0 0 4px; font: 600 15px var(--font-display); }
.chart-card .note { font-size: 12px; color: var(--muted); margin: 0 0 6px; }
.chart-host { width: 100%; min-height: 200px; }
.uplot { font-family: var(--font-body); }
.u-legend { font-size: 12px; color: var(--ink2); text-align: left; }
.u-legend .u-marker { width: 10px; height: 10px; border-radius: 2px; }
.u-legend th { background: transparent; position: static; font-weight: 500; }
.u-legend td, .u-legend th { border: 0; padding: 1px 6px; text-align: left; }
.u-select { background: rgba(42, 120, 214, .12); }

.alerts { display: grid; gap: 8px; }
.alert { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; }
.alert b { font-weight: 600; }
footer { margin-top: 36px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); }
@media (max-width: 640px) { th, td { padding: 6px 8px; } .score-big { font-size: 44px; } }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }
</style>
</head>

    <h1>Private page</h1>
    <p>Enter the password to open this page. It is decrypted in your browser.</p>
    <label for="pw">Password</label>
    <input id="pw" name="password" type="password" autocomplete="current-password" required>
    <label class="chk" for="remember"><input id="remember" type="checkbox" checked> Remember on this device</label>
    <button class="btn" id="unlock" type="submit">Unlock</button>
    <div class="gate-msg" id="gate-msg" role="alert"></div>
  </form>
</div>
<div id="app" class="wrap" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/uplot@1.6.31/dist/uPlot.iife.min.js"></script>
<script>
(function () {
"use strict";
const BOX = JSON.parse(document.getElementById("payload").textContent);
const KEY_NAME = "bbm-key:" + (BOX.salt || "plain");
let D = null;

// ---------------- decryption ----------------
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const toB64 = buf => btoa(String.fromCharCode.apply(null, new Uint8Array(buf)));
async function deriveKey(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(BOX.salt), iterations: BOX.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
}
async function openBox(key) {
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(BOX.iv) }, key, b64(BOX.ct));
  const stream = new Blob([pt]).stream().pipeThrough(new DecompressionStream("gzip"));
  return JSON.parse(await new Response(stream).text());
}
function store(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) { /* storage blocked */ } }
function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

async function tryRemembered() {
  const raw = load(KEY_NAME);
  if (!raw) return false;
  try {
    const key = await crypto.subtle.importKey("raw", b64(raw), { name: "AES-GCM" }, false, ["decrypt"]);
    D = await openBox(key);
    return true;
  } catch (e) { store(KEY_NAME, null); return false; }
}

const gate = document.getElementById("gate"), form = document.getElementById("gate-form"), msg = document.getElementById("gate-msg");
form.addEventListener("submit", async ev => {
  ev.preventDefault();
  const btn = document.getElementById("unlock");
  btn.disabled = true; msg.textContent = "Unlocking…";
  try {
    const key = await deriveKey(document.getElementById("pw").value);
    D = await openBox(key);
    if (document.getElementById("remember").checked) store(KEY_NAME, toB64(await crypto.subtle.exportKey("raw", key)));
    start();
  } catch (e) {
    msg.textContent = "That password did not open the page. Check it and try again.";
  } finally { btn.disabled = false; }
});

async function boot() {
  if (BOX.plain) { D = BOX.plain; start(); return; }
  if (!window.crypto || !crypto.subtle || typeof DecompressionStream === "undefined") {
    msg.textContent = "This browser cannot decrypt the page. Use a current Chrome, Edge, Safari or Firefox.";
    return;
  }
  if (await tryRemembered()) start();
  else document.getElementById("pw").focus();
}

// ---------------- formatting ----------------
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
function fdate(s, year = true) { if (!s) return "—"; const [y, m, d] = s.split("-").map(Number); return `${d} ${MON[m - 1]}${year ? " " + y : ""}`; }
function usd(v) { if (v == null) return "—"; return v >= 1000 ? "$" + Math.round(v).toLocaleString("en-US") : "$" + v.toFixed(2); }
function usdK(v) { if (v == null) return "—"; if (v >= 1e6) return "$" + (v / 1e6).toFixed(1) + "M"; if (v >= 10000) return "$" + (v / 1000).toFixed(v >= 100000 ? 0 : 1) + "k"; return usd(v); }
function pct(v, d = 0, sign = true) { if (v == null) return "—"; const s = (v * 100).toFixed(d); return (sign && v > 0 ? "+" : "") + s.replace("-", "−") + "%"; }
function drop(v) { return v == null ? "—" : Math.abs(v * 100).toFixed(0) + "%"; }
function daysTxt(d) { if (d == null) return ""; return d < 60 ? `~${Math.round(d)}d` : `~${Math.round(d / 30.4)} mo`; }
function daysBetween(a, b) { return Math.round((Date.parse(b) - Date.parse(a)) / 86400000); }
function hitTag(h, a) { if (!a) return '<span class="muted">n/a</span>'; const k = h === a ? "good" : h >= a / 2 ? "warn" : "bad"; return `<span class="tag ${k}">${h}/${a}</span>`; }
function fdTag(v) { if (v == null) return '<span class="muted">—</span>'; const k = v > -0.15 ? "good" : v > -0.30 ? "warn" : "bad"; return `<span class="tag ${k}">${pct(v)}</span>`; }

// ---------------- render ----------------
function start() {
  gate.hidden = true;
  document.title = "BTC Bottom Monitor";
  const app = document.getElementById("app");
  app.hidden = false;
  app.innerHTML = render();
  wire();
  buildCharts();
}

function render() {
  const M = D.meta;
  return [header(M), band(M), activeChips(M), conditionsSection(), chartsSection(), scoreSection(), firstTriggerSection(),
          levelsSection(), bottomsSection(), fingerprintSection(), alertsSection(), sourcesSection(), footer()].join("");
}

function header(M) {
  return `<header class="top">
    <div><h1>BTC Bottom Monitor</h1>
      <div class="meta-line">Data to ${fdate(M.data_date)} · updated ${esc(M.generated)}</div></div>
    <div class="head-right"><button class="btn ghost" id="lock" type="button">Lock this device</button></div>
  </header>
  <nav class="toc" aria-label="Sections"><a href="#conditions">Conditions</a><a href="#charts">Charts</a><a href="#score">Score</a><a href="#first">First triggers</a><a href="#levels">Price levels</a><a href="#bottoms">Bottoms</a><a href="#fingerprint">Fingerprint</a><a href="#alerts">Alerts</a><a href="#sources">Sources</a></nav>`;
}

function band(M) {
  const max = M.score_max, s = M.score;
  const pos = v => (v / max * 100).toFixed(2) + "%";
  const lo = Math.min(...M.bear_peaks), hi = Math.max(...M.bear_peaks);
  const ticks = [0, 6, 8, 10, 12, max].filter((v, i, a) => a.indexOf(v) === i && v <= max)
    .map(v => `<span class="tick" style="left:${pos(v)}">${v}</span>`).join("");
  const lines = [6, 8, 10, 12].filter(v => v < max).map(v => `<span class="tickline" style="left:${pos(v)}"></span>`).join("");
  const missing = M.score_missing && M.score_missing.length ? `<div class="legend-note">Left out today (no fresh data): ${esc(M.score_missing.join(", "))}.</div>` : "";
  const lag = M.bear_lag || [];
  const nh = M.next_halving;
  return `<div class="band">
    <div class="card"><h2>Bottom score</h2>
      <div class="score-row"><div class="score-big">${s}<small> / ${max}</small></div><span class="pill ${esc(M.regime.level)}">${esc(M.regime.label)}</span></div>
      <p class="regime-text">${esc(M.regime.text)}</p>
      <div class="meter" role="img" aria-label="Score ${s} of ${max}; past bear-market lows peaked at ${lo} to ${hi}">
        <div class="track"><div class="fill" style="width:${pos(s)}"></div>${lines}</div>
        <div class="zone" style="left:${pos(lo)};width:calc(${pos(hi)} - ${pos(lo)})"></div>${ticks}
      </div>
      <div class="legend-note">Dashed box: peak score at the past bear-market lows (${lo}–${hi}).</div>${missing}
    </div>
    <div class="card"><h2>Price</h2>
      <div class="big">${usd(M.price)}</div>
      <div class="kv">
        <span>From the ATH (${usd(M.ath)}, ${fdate(M.ath_date)})</span><span>${pct(M.dd_ath)}</span>
        <span>Realized price</span><span>${usd(M.realized_price)} <span class="muted">${pct(M.realized_price / M.price - 1)}</span></span>
        <span>200-week MA</span><span>${usd(M.ma200w)} <span class="muted">${pct(M.ma200w / M.price - 1)}</span></span>
        <span>Mayer 0.6 (0.6 × 200-day MA)</span><span>${usd(M.ma200d * 0.6)} <span class="muted">${pct(M.ma200d * 0.6 / M.price - 1)}</span></span>
      </div>
    </div>
    <div class="card"><h2>Cycle clock</h2>
      <div class="big">Day ${M.days_since_ath}</div>
      <div class="kv">
        <span>Days since the ATH</span><span>${M.days_since_ath}</span>
        <span>Past bear lows came on day</span><span>${lag.join(", ")}</span>
        <span>Days since the halving</span><span>${M.days_since_halving}</span>
        <span>Next halving (est.)</span><span>${nh ? fdate(nh.date) + ` <span class="muted">in ${nh.days}d</span>` : "—"}</span>
      </div>
    </div>
  </div>`;
}

function activeChips(M) {
  const on = M.active || [];
  if (!on.length) return `<div class="chips"><span class="lbl">No condition is active today.</span></div>`;
  return `<div class="chips"><span class="lbl">Active now:</span>${on.map(c => `<span class="chip${c.core ? " core" : ""}">${esc(c.label)}</span>`).join("")}</div>`;
}

function conditionsSection() {
  const rows = [];
  let grp = null;
  const conds = D.conditions.slice().sort((a, b) => (b.core - a.core) || 0);
  for (const c of conds) {
    const g = c.core ? "In the score" : "Extra signals";
    if (g !== grp) { rows.push(`<tr data-core="${c.core ? 1 : 0}"><td class="grp" colspan="8">${g}</td></tr>`); grp = g; }
    const status = c.on
      ? `<span class="pill on">Active</span><div class="sub">since ${fdate(c.since)} · ${daysBetween(c.since, D.meta.data_date) + 1}d</div>`
      : `<span class="pill off">Off</span>${c.last_start ? `<div class="sub">last active ${c.last_start === c.last_end ? fdate(c.last_start) : fdate(c.last_start) + " to " + fdate(c.last_end)}</div>` : '<div class="sub">never active</div>'}`;
    const bear = c.bear_hits
      ? `${fdTag(c.bear_med)}<div class="sub">${c.bear_hits > 1 ? `range ${drop(c.bear_best)}–${drop(c.bear_worst)} · ` : ""}${daysTxt(c.bear_days)} to the low</div>`
      : `<span class="muted">${c.bear_avail ? "never fired before a bear low" : "n/a"}</span>`;
    const held = c.eps_done ? `<span class="num">${c.eps_good}/${c.eps_done}</span><div class="sub">median 1y ${pct(c.eps_med_r365)}</div>` : '<span class="muted">—</span>';
    rows.push(`<tr class="${c.on ? "is-on" : ""}" data-core="${c.core ? 1 : 0}">
      <td class="l wrap-cell"><b>${esc(c.label)}</b>${c.core ? ' <span class="pill core">score</span>' : ""}<div class="sub">${esc(c.desc)}</div></td>
      <td class="num">${esc(c.value)}</td><td class="l muted">${esc(c.thr)}</td><td class="l">${status}</td>
      <td>${hitTag(c.bear_hits, c.bear_avail)}</td><td>${bear}</td><td>${held}</td>
      <td class="num muted">${c.eps_med_dd == null ? "—" : pct(c.eps_med_dd)}</td></tr>`);
  }
  return `<section id="conditions"><h2>Conditions</h2>
    <p class="lede">Each row is a rule that is on or off every day. <b>Past bears</b>: in how many of the bear-market drawdowns (from the ATH to the low) it fired. <b>Further fall</b>: from the close on its first day to the final low, median of those bears. <b>Held</b>: share of all past trigger episodes where price never fell 20% more and was higher a year later.</p>
    <div class="filters"><div class="seg" role="group" aria-label="Show"><button type="button" data-f="all" aria-pressed="true">All</button><button type="button" data-f="on" aria-pressed="false">Active only</button><button type="button" data-f="core" aria-pressed="false">Score only</button></div></div>
    <div class="tbl"><table class="sticky1" id="cond-table"><thead><tr><th class="l">Condition</th><th>Now</th><th class="l">Rule</th><th class="l">Status</th><th>Past bears</th><th>Further fall after 1st trigger</th><th>Held</th><th>Median max fall, all triggers</th></tr></thead>
    <tbody>${rows.join("")}</tbody></table></div></section>`;
}

function chartsSection() {
  return `<section id="charts"><h2>Charts</h2>
    <p class="lede">Drag across a chart to zoom, double-click to reset. Shaded bands are the bottom zones from the research. Red dots are the bear-market bottoms, violet the current cycle's low so far.</p>
    <div class="filters"><div class="seg" role="group" aria-label="Range" id="range"><button type="button" data-r="365">1Y</button><button type="button" data-r="730">2Y</button><button type="button" data-r="1461" aria-pressed="true">4Y</button><button type="button" data-r="0">All</button></div></div>
    <div class="charts">
      <div class="chart-card wide"><h3>Price and the bottom levels</h3><p class="note">Log scale. Realized price is the average on-chain cost basis.</p><div class="chart-host" id="ch-price"></div></div>
      <div class="chart-card wide"><h3>Bottom score</h3><p class="note">Number of score conditions active each day. Lines at 6, 8 and 10.</p><div class="chart-host" id="ch-score"></div></div>
      <div class="chart-card"><h3>MVRV</h3><p class="note">Shaded below 1 (holders at a loss).</p><div class="chart-host" id="ch-mvrv"></div></div>
      <div class="chart-card"><h3>Puell multiple</h3><p class="note">Shaded below 0.5 (miner stress).</p><div class="chart-host" id="ch-puell"></div></div>
      <div class="chart-card"><h3>Mayer multiple</h3><p class="note">Shaded below 0.6.</p><div class="chart-host" id="ch-mayer"></div></div>
      <div class="chart-card"><h3>Weekly RSI</h3><p class="note">Shaded below 35.</p><div class="chart-host" id="ch-rsi"></div></div>
    </div></section>`;
}

function perBearCells(per) {
  return per.map(x => x.state === "na" ? '<td class="muted">n/a</td>' : x.state === "miss" ? '<td class="muted">not reached</td>'
    : `<td>${fdTag(x.fd)}<div class="sub">${fdate(x.first)} · ${usdK(x.px)} · ${x.days}d</div></td>`).join("");
}

function scoreSection() {
  const M = D.meta;
  const rows = D.scores.map(s => `<tr class="${s.on ? "is-on" : ""}"><td class="l"><b>Score ≥ ${s.k}</b><div class="sub">${s.on ? "active since " + fdate(s.since) : "not active"}</div></td>
    <td>${hitTag(s.bear_hits, s.bear_avail)}</td><td>${fdTag(s.bear_med)}<div class="sub">${s.bear_hits > 1 ? `range ${drop(s.bear_best)}–${drop(s.bear_worst)} · ` : ""}${daysTxt(s.bear_days)}</div></td>
    <td class="num">${s.eps_done}</td><td class="num">${s.eps_pos}/${s.eps_done}</td><td class="num">${pct(s.eps_med_r365)}</td><td class="num">${pct(s.eps_med_dd)}</td><td class="num">${pct(s.eps_worst_dd)}</td></tr>`).join("");
  const eps = [];
  for (const s of D.scores) for (const e of s.episodes) eps.push(`<tr><td class="l">≥ ${s.k}</td><td class="l">${fdate(e.start)}</td><td class="l">${fdate(e.end)}</td><td>${usd(e.px)}</td><td>${pct(e.max_dd)}</td><td>${e.days_to_min}</td><td>${e.complete ? pct(e.r365) : '<span class="muted">open</span>'}</td></tr>`);
  return `<section id="score"><h2>Score milestones</h2>
    <p class="lede">The score counts ${M.score_max} conditions. Every bear-market low peaked at ${Math.min(...M.bear_peaks)}–${Math.max(...M.bear_peaks)}. The Telegram bot alerts when the score first reaches 6, 8, 10 or 12 after at least 30 days below it.</p>
    <div class="tbl"><table class="sticky1"><thead><tr><th class="l">Milestone</th><th>Past bears</th><th>Further fall from the first day (bears)</th><th>Episodes</th><th>Higher 1y later</th><th>Median 1y return</th><th>Median max fall</th><th>Worst max fall</th></tr></thead><tbody>${rows}</tbody></table></div>
    <details style="margin-top:10px"><summary>Every score episode</summary>
    <div class="tbl" style="margin-top:8px"><table><thead><tr><th class="l">Milestone</th><th class="l">First day</th><th class="l">Last day</th><th>Price on first day</th><th>Max fall within 1y</th><th>Days to that low</th><th>1-year return</th></tr></thead><tbody>${eps.join("")}</tbody></table></div></details></section>`;
}

function firstTriggerSection() {
  const names = D.meta.bear_names;
  const head = names.map(n => `<th>${esc(n)}</th>`).join("");
  const rows = D.scores.map(s => `<tr><td class="l"><b>Score ≥ ${s.k}</b></td>${perBearCells(s.per)}</tr>`).concat(
    D.conditions.map(c => `<tr class="${c.on ? "is-on" : ""}"><td class="l">${esc(c.label)}</td>${perBearCells(c.per)}</tr>`));
  return `<section id="first"><h2>First trigger in each bear market</h2>
    <p class="lede">Fall from the close on the first day a rule fired (counting from the ATH) to the bear-market intraday low. Below each: the trigger date, the price that day and the days left to the low.</p>
    <div class="tbl"><table class="sticky1"><thead><tr><th class="l">Rule</th>${head}</tr></thead><tbody>${rows.join("")}</tbody></table></div></section>`;
}

function levelsSection() {
  const P = D.meta.price;
  const rows = D.levels.map(l => `<tr><td class="l"><b>${esc(l.label)}</b>${l.note ? `<div class="sub">${esc(l.note)}</div>` : ""}</td><td class="num">${usd(l.price)}</td><td class="num">${pct(l.vs)}</td></tr>`);
  rows.splice(D.levels.filter(l => l.price > P).length, 0, `<tr class="is-on"><td class="l"><b>BTC now</b></td><td class="num">${usd(P)}</td><td class="num">0%</td></tr>`);
  return `<section id="levels"><h2>Price levels</h2>
    <p class="lede">Where each historical bottom condition would be met at today's values. These levels move: the realized price drifts, the 200-week MA rises, the 200-day MA falls while price is below it.</p>
    <div class="tbl"><table class="sticky1"><thead><tr><th class="l">Level</th><th>Price</th><th>vs now</th></tr></thead><tbody>${rows.join("")}</tbody></table></div></section>`;
}

function bottomsSection() {
  const kind = { bear: '<span class="pill crit">Bear-market bottom</span>', open: '<span class="pill note">Current cycle low (open)</span>', correction: '<span class="pill">Correction</span>' };
  const rows = D.bottoms.slice().reverse().map(b => `<tr><td class="l"><b>${fdate(b.date)}</b></td><td>${usd(b.close)}</td><td>${usd(b.low)}</td><td class="l">${fdate(b.start)} <span class="muted">${usd(b.start_px)}</span></td><td>${pct(b.decline)}</td><td>${pct(b.dd_ath)}</td><td>${b.days}</td><td>${b.peak_score == null ? "—" : b.peak_score}</td><td class="l">${kind[b.kind]}</td></tr>`).join("");
  return `<section id="bottoms"><h2>Bottoms</h2>
    <p class="lede">Swing lows after a 30%+ fall, confirmed by a 40% rally. A bear-market bottom is the lowest close between two ATHs, at least 70% down and 120+ days after the ATH.</p>
    <div class="tbl"><table class="sticky1"><thead><tr><th class="l">Low (close)</th><th>Close</th><th>Intraday low</th><th class="l">Measured from</th><th>Decline</th><th>From ATH</th><th>Days</th><th>Peak score</th><th class="l">Type</th></tr></thead><tbody>${rows}</tbody></table></div></section>`;
}

function fingerprintSection() {
  const F = D.fingerprint;
  const head = F.cols.map(c => `<th>${esc(c)}</th>`).join("");
  const rows = F.rows.map(r => `<tr><td class="l">${esc(r.label)}</td>${r.values.map(v => `<td class="num">${esc(v)}</td>`).join("")}</tr>`).join("");
  return `<section id="fingerprint"><h2>Fingerprint</h2>
    <p class="lede">Readings on the day of each bear-market low, the current cycle's low so far, and today.</p>
    <div class="tbl"><table class="sticky1"><thead><tr><th class="l">Reading</th>${head}</tr></thead><tbody>${rows}</tbody></table></div></section>`;
}

function alertsSection() {
  const A = D.alerts || [];
  const body = A.length ? A.map(a => `<div class="alert"><b>${esc(a.label)}</b> · fired ${fdate(a.fired)} at ${usd(a.price)} · score ${a.score}
      <div class="sub">Past bears ${a.bear_hits}/${a.bear_avail}${a.bear_med != null ? ` · further fall median ${drop(a.bear_med)} (worst ${drop(a.bear_worst)}) · ${daysTxt(a.bear_days)} to the low` : ""}${a.eps_done ? ` · held ${a.eps_good}/${a.eps_done}` : ""} · sent ${esc(a.run)}</div></div>`).join("")
    : '<p class="lede">No alert has been sent yet. Alerts appear here after the first new trigger.</p>';
  return `<section id="alerts"><h2>Alert history</h2><div class="alerts">${body}</div></section>`;
}

function sourcesSection() {
  const rows = D.meta.sources.map(s => `<tr><td class="l">${esc(s.name)}</td><td class="l">${s.ok ? esc(s.via) : '<span class="tag warn">cache</span>'}</td><td>${fdate(s.last)}</td><td class="l wrap-cell muted">${esc((s.errors || []).join("; "))}</td></tr>`).join("");
  return `<section id="sources"><h2>Data sources</h2>
    <p class="lede">Coin Metrics (on-chain), Blockchain.com (difficulty), Yahoo Finance / Coinbase / Bitget (BTC high-low, S&amp;P 500, VIX, dollar), FRED (rates, M2, Fed balance sheet, credit), Alternative.me (Fear &amp; Greed), CBBI, DefiLlama (stablecoins), Bybit / Bitget (funding). A source that fails falls back to the last saved copy.</p>
    <div class="tbl"><table><thead><tr><th class="l">Source</th><th class="l">Fetched from</th><th>Latest day</th><th class="l">Errors this run</th></tr></thead><tbody>${rows}</tbody></table></div></section>`;
}

function footer() {
  return `<footer>Statistics come from ${D.meta.bear_names.length} bear-market bottoms (${esc(D.meta.bear_names.join(", "))}) and every trigger episode since 2011. Four bottoms is a small sample: read the figures as base rates, not forecasts. Not financial advice.</footer>`;
}

// ---------------- interactions ----------------
function wire() {
  document.getElementById("lock").addEventListener("click", () => { store(KEY_NAME, null); location.reload(); });
  const seg = document.querySelector('[aria-label="Show"]');
  seg.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    const f = b.dataset.f;
    document.querySelectorAll("#cond-table tbody tr").forEach(tr => {
      const isGrp = tr.querySelector("td.grp");
      let show = true;
      if (f === "on") show = !isGrp && tr.classList.contains("is-on");
      if (f === "core") show = tr.dataset.core === "1";
      tr.hidden = !show;
    });
  });
  document.getElementById("range").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    document.querySelectorAll("#range button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    setRangeDays(Number(b.dataset.r));
  });
}

// ---------------- charts ----------------
let charts = [];
let X = { min: null, max: null };
function colors() {
  const cs = getComputedStyle(document.documentElement), g = n => cs.getPropertyValue(n).trim();
  return { ink2: g("--ink2"), muted: g("--muted"), grid: g("--grid"), surface: g("--surface"), blue: g("--c-blue"), orange: g("--c-orange"),
           aqua: g("--c-aqua"), yellow: g("--c-yellow"), violet: g("--c-violet"), red: g("--c-red"), cmuted: g("--c-muted"), bad: g("--bad") };
}
function axisUsd(v) { return v >= 1e6 ? "$" + v / 1e6 + "M" : v >= 1000 ? "$" + v / 1000 + "k" : v >= 1 ? "$" + v : "$" + v.toFixed(2); }
function setRangeDays(days) {
  const T = D.series.t, last = T[T.length - 1];
  X = days ? { min: last - days * 86400, max: last + 86400 * 7 } : { min: T[0], max: last + 86400 * 30 };
  charts.forEach(u => u.setScale("x", X));
}
function zoneHook(spec, C) {
  return u => {
    if (!spec.zone) return;
    const ctx = u.ctx, { left, top, width, height } = u.bbox;
    const yv = u.valToPos(spec.zone.below, "y", true);
    ctx.save(); ctx.fillStyle = C.aqua; ctx.globalAlpha = 0.12;
    const y0 = Math.max(top, Math.min(top + height, yv));
    ctx.fillRect(left, y0, width, top + height - y0);
    ctx.restore();
  };
}
function lineHook(spec, C) {
  return u => {
    const ctx = u.ctx, { left, width, top, height } = u.bbox;
    for (const L of spec.lines || []) {
      const y = u.valToPos(L.v, "y", true);
      if (y < top || y > top + height) continue;
      ctx.save(); ctx.strokeStyle = C[L.color] || C.aqua; ctx.lineWidth = devicePixelRatio; ctx.setLineDash([5 * devicePixelRatio, 4 * devicePixelRatio]);
      ctx.beginPath(); ctx.moveTo(left, y); ctx.lineTo(left + width, y); ctx.stroke(); ctx.restore();
    }
  };
}
function makeChart(id, spec) {
  const host = document.getElementById(id);
  const C = colors(), S = D.series;
  const series = [{ value: (u, v) => v == null ? "—" : fdateTs(v) }];
  const data = [S.t];
  for (const s of spec.series) {
    const o = { label: s.label, stroke: C[s.color], width: s.width == null ? 1.6 : s.width, spanGaps: !!s.span,
                value: (u, v) => v == null ? "—" : spec.fmt(v), points: { show: false } };
    if (s.dash) o.dash = s.dash;
    if (s.fill) o.fill = s.fill;
    if (s.step) o.paths = uPlot.paths.stepped({ align: 1 });
    if (s.dots) { o.paths = () => null; o.points = { show: true, size: s.size || 9, width: 1.5, stroke: C.surface, fill: C[s.color] }; o.width = 0; }
    series.push(o); data.push(s.data);
  }
  const font = "11px " + getComputedStyle(document.body).fontFamily;
  const yScale = spec.log ? { distr: 3, range: (u, mn, mx) => [mn * 0.85, mx * 1.12] } : { range: spec.range };
  const u = new uPlot({
    width: Math.max(280, host.clientWidth), height: spec.height || 230, series,
    scales: { x: { time: true, min: X.min, max: X.max }, y: yScale },
    axes: [
      { stroke: C.muted, font, grid: { stroke: C.grid, width: 1 }, ticks: { stroke: C.grid, width: 1, size: 4 } },
      Object.assign({ stroke: C.muted, font, size: 54, grid: { stroke: C.grid, width: 1 }, ticks: { stroke: C.grid, width: 1, size: 4 },
        values: (u, vals) => vals.map(v => v == null ? "" : spec.axis ? spec.axis(v) : v) }, spec.log ? { splits: logSplits } : {}),
    ],
    cursor: { sync: { key: "bbm" }, drag: { x: true, y: false, setScale: false }, points: { size: 6 } },
    legend: { live: true },
    hooks: {
      drawClear: [zoneHook(spec, C)],
      draw: [lineHook(spec, C)],
      setSelect: [u => {
        if (u.select.width > 6) {
          const min = u.posToVal(u.select.left, "x"), max = u.posToVal(u.select.left + u.select.width, "x");
          X = { min, max }; charts.forEach(c => c.setScale("x", X));
          document.querySelectorAll("#range button").forEach(x => x.setAttribute("aria-pressed", "false"));
        }
        u.setSelect({ left: 0, top: 0, width: 0, height: 0 }, false);
      }],
    },
  }, data, host);
  u.setScale("x", X);
  u.over.addEventListener("dblclick", () => { document.querySelector('#range button[data-r="1461"]').click(); });
  return u;
}
function logSplits(u, axisIdx, min, max) {
  const decades = Math.log10(max / min);
  const mults = decades > 4 ? [1] : decades > 1.6 ? [1, 2, 5] : [1, 2, 3, 5, 7];
  const out = [];
  for (let e = Math.floor(Math.log10(min)); e <= Math.ceil(Math.log10(max)); e++)
    for (const k of mults) { const v = k * Math.pow(10, e); if (v >= min && v <= max) out.push(v); }
  return out;
}
function fdateTs(t) { const d = new Date(t * 1000); return `${d.getUTCDate()} ${MON[d.getUTCMonth()]} ${d.getUTCFullYear()}`; }
function fmtNum(d) { return v => v.toFixed(d); }
function buildCharts() {
  charts.forEach(u => u.destroy()); charts = [];
  if (typeof uPlot === "undefined") {
    document.querySelectorAll(".chart-host").forEach(h => { h.innerHTML = '<p class="lede">Charts need the uPlot library from cdn.jsdelivr.net, which did not load.</p>'; });
    return;
  }
  if (X.min == null) { const T = D.series.t, last = T[T.length - 1]; X = { min: last - 1461 * 86400, max: last + 86400 * 7 }; }
  const S = D.series;
  const C = colors();
  charts.push(makeChart("ch-price", { log: true, height: 320, fmt: v => usd(v), axis: axisUsd, series: [
    { label: "BTC", color: "blue", data: S.price, width: 1.8 },
    { label: "200-week MA", color: "orange", data: S.ma200w },
    { label: "Realized price", color: "aqua", data: S.rp },
    { label: "0.85 × realized", color: "aqua", data: S.rp085, dash: [4, 4], width: 1.2 },
    { label: "Mayer 0.6", color: "yellow", data: S.mayer06, dash: [4, 4], width: 1.2 },
    { label: "Bear bottom", color: "red", data: S.bear, dots: true },
    { label: "Cycle low (open)", color: "violet", data: S.open, dots: true },
  ] }));
  charts.push(makeChart("ch-score", { range: [0, D.meta.score_max], height: 190, fmt: v => String(v), axis: v => String(v),
    lines: [{ v: 6, color: "yellow" }, { v: 8, color: "orange" }, { v: 10, color: "red" }],
    series: [{ label: "Score", color: "blue", data: S.score, step: true, fill: C.blue + "33", width: 1.4 }] }));
  charts.push(makeChart("ch-mvrv", { range: (u, mn, mx) => [Math.min(0.3, mn), Math.max(mx, 1.2)], fmt: fmtNum(2), axis: v => v.toFixed(1), zone: { below: 1 }, lines: [{ v: 1 }, { v: 0.85, color: "red" }],
    series: [{ label: "MVRV", color: "blue", data: S.mvrv }] }));
  charts.push(makeChart("ch-puell", { range: (u, mn, mx) => [0, Math.min(Math.max(mx, 1), 6)], fmt: fmtNum(2), axis: v => v.toFixed(1), zone: { below: 0.5 }, lines: [{ v: 0.5 }],
    series: [{ label: "Puell", color: "blue", data: S.puell }] }));
  charts.push(makeChart("ch-mayer", { range: (u, mn, mx) => [Math.min(0.2, mn), Math.min(Math.max(mx, 1.2), 5)], fmt: fmtNum(2), axis: v => v.toFixed(1), zone: { below: 0.6 }, lines: [{ v: 0.6 }],
    series: [{ label: "Mayer", color: "blue", data: S.mayer }] }));
  charts.push(makeChart("ch-rsi", { range: [0, 100], fmt: fmtNum(0), axis: v => String(v), zone: { below: 35 }, lines: [{ v: 35 }, { v: 40, color: "yellow" }],
    series: [{ label: "Weekly RSI", color: "blue", data: S.rsi_w }, { label: "Monthly RSI", color: "violet", data: S.rsi_m, width: 1.2 }] }));
}
let rt;
window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { if (D) charts.forEach(u => { const h = u.root.parentElement; u.setSize({ width: Math.max(280, h.clientWidth), height: u.height }); }); }, 150); });
if (window.matchMedia) window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (D) buildCharts(); });
boot();
})();
</script>
